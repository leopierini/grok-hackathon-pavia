name: Ground verification

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check patrol tests tools
      - run: python -m mypy patrol/ground
      - run: python -m coverage run -m pytest -q --junitxml=artifacts/tests.xml
      - run: python -m coverage json -o artifacts/coverage.json
      - run: python tools/verify_ground.py --seeds 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
