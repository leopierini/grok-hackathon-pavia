[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-patrol"
version = "0.1.0"
description = "Robot Patrol ground-station foundation"
requires-python = ">=3.11"
dependencies = [
    "pillow==11.3.0",
    "prompt_toolkit==3.0.52",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.14.2",
    "coverage==7.11.0",
    "jsonschema==4.25.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["patrol*"]

[tool.setuptools.package-data]
"patrol.ground" = ["py.typed"]
"*" = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["patrol", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"patrol/contract.py" = ["F", "E", "I", "UP", "B"]
"patrol/ground/operator/**/*.py" = ["E501"]
"tests/ground/operator/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["patrol.ground"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "patrol.contract"
ignore_errors = true

[tool.coverage.run]
branch = true
source = ["patrol"]

[tool.coverage.report]
show_missing = true
