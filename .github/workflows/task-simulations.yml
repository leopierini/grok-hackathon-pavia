name: Task simulations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  task-simulations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ground base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python tools/verify_ground.py
